site_name: tcpdump for Mere Mortals
site_description: Plain-language tcpdump. Watching the packets your own machines actually send, reading one packet line by line, the filter language, saving captures that outlive the terminal, and knowing exactly what a capture cannot show you, practised on a loopback lab you plant yourself.
site_url: https://paulsullivan33-dev.github.io/tcpdump-for-mere-mortals/

